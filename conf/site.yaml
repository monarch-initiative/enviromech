# How the documentation site and the record browser look.
# `just site-check` validates this file and reports text contrast.
# `just render` and `just docs-build` apply it. The `site-design` skill
# explains every setting.

# Title of the record browser's front page.
title: "EnviroMech records"

# Main color, for the docs site's header and the browser's header band and
# links. A Material for MkDocs color name: red, pink, purple, deep-purple,
# indigo, blue, light-blue, cyan, teal, green, light-green, lime, yellow,
# amber, orange, deep-orange, brown, grey, blue-grey.
palette: indigo

# The record browser's brand color, as #rrggbb: the dark green of the logo.
# It colors the header band, the links and the hover color, in lighter and
# darker variations. Leave it out to use palette and accent. It does not
# change the docs site.
banner: "#2f5d1f"

# A second brand color, #rrggbb: the dark purple of the logo. It colors the left
# edge of cards and of the box at the top of a record page, the selected tab and
# page, and the dismech boxes in the graph, with a wash of it on pills and a
# lighter variation for hover. Leave it out to use
# the banner color throughout.
highlight: "#4b2f7f"

# Highlight color, for hover and focus. A Material accent name: the palette
# names above except brown, grey and blue-grey.
accent: indigo

# auto follows each visitor's system setting; light or dark fixes it.
theme: auto

# Columns of the browser's front page, which lists every record: fields of the
# record, in order. A field holding an ontology term shows its label.
index_columns:
  - name
  - kind
  - id
  - status

# Columns of each record kind's own list view, which the front page's kind
# links lead to. A kind left out here uses index_columns. A column names a
# field of the record, reaching into a nested one with dots (event.short_name),
# or one of the values render.py derives: aop_wiki_id, key_events,
# ke_relationships, dismech_nodes, dismech_models, level, level_screening and,
# for a Key Event, aops (the AOPs it appears in, with its role in each) and,
# for a KER, relationship_id and aops, and for a Method, test_guidelines.
kind_columns:
  AOP:
    - name
    - aop_wiki_id
    - key_events
    - ke_relationships
    - dismech_nodes
    - dismech_models
    - status
  Key Event:
    - name
    - aop_wiki_id
    - level
    - aops
    - level_screening
    - dismech_nodes
    - status
  KER:
    - name
    - relationship_id
    - aops
    - status
  Method:
    - name
    - test_guidelines
    - key_events
    - mapping_reference
  Observation:
    - name
    - causal_agent
    - asserted_relation
    - key_events
    - status

# Record sections left off the browser's record pages. They stay in the data.
hidden_sections:
  - curation_history
  - mapping_extraction

# Footer text on every browser page; empty for none.
footer: ""
