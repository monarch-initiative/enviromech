  source_link_type: INDIRECT_KNOWN_INTERMEDIATES
  description: >-
    Loss of C1d projection components impairs effective respiratory surface
    transport. dismech supports the edge with one in vitro ciliary transport
    study (PMID:39362668).
rationale: >-
  Both nodes bind mucociliary clearance, decreased, which is the Event's component
  with the same direction; the ontologies differ (GO process on the nodes, VT trait
  on the Event) but name the same change. Impaired Mucociliary Clearance is
  dismech's convergence point for every ciliary route to clearance failure in this
  entry. Central-Apparatus Transport Dysfunction is one of those routes, and it is
  aggregated rather than left upstream because nothing measures it except
  transport: its readout is the same particle-transport measurement that
  instruments the convergence node, so no assay separates the two ends of the
  edge between them. Together they are the change KE 1909 names, and they
  constitute it.
level_mismatch_note: >-
  Impaired Mucociliary Clearance is TISSUE and Central-Apparatus Transport
  Dysfunction is CELLULAR in dismech; the Event is Individual in AOP-Wiki. The
  evidence supports these at different levels of measurement. Every model readout
  on both nodes is transport across a cultured airway epithelium, which is
  tissue-level, even for the node dismech scales as cellular. The convergence
  node's description also cites whole-lung radioaerosol clearance in patients,
  which is individual-level and is the kind of measurement KE 1909's own method
  text describes. So the mismatch is not an error on either side. The Event's
  level is kept; the tissue readouts would inform it as measurements of a proxy
  rather than of the Event itself.
