  notes: >-
    Two readouts from the GAS2L2-deficient patient nasal model: ciliary
    orientation and beat coordination (ALTERED) and ciliary beat frequency
    (INCREASED). The increase is compatible with the Event's component (abnormal
    motility) and not with its title (frequency decreased).
rationale: >-
  Both nodes bind the same process term, cilium movement, with the same modifier,
  abnormal, on the same cell type, and both are measured by beat pattern or beat
  frequency in ciliated airway cultures. Read against the Event's component,
  occurrence of abnormal ciliary motility in the motile cilium, the two nodes
  together are that change and nothing more, so they constitute it. Read against
  the Event's title alone they would not fit: dismech records preserved or
  increased frequency for some genotypes, and the Event title asserts a decrease.
  The aggregation therefore rests on the component, and the title is narrower
  than the Event it names. dismech keeps the two nodes apart because directional
  alignment and beat frequency are quantified separately; the AOP does not need
  that resolution to predict decreased mucociliary clearance, which is the
  simplification the aggregation makes.
notes: >-
  KE 1908 sits in AOPs 411, 424 and 425. The aggregation is asserted for the
  Event, not for any one of those pathways.
