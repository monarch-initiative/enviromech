id: https://w3id.org/monarch-initiative/enviromech
name: enviromech
title: EnviroMech schema
description: >-
  The EnviroMech schema. It imports the AOP-Wiki EMOD schema from
  EHS-Data-Standards/linkml-aop unchanged and adds only the classes that
  EnviroMech needs while they are being worked out. A class that earns a
  place in EMOD moves to linkml-aop; a class that turns out to be specific to
  deriving pathways from external knowledge bases stays here.

  SKETCH. See the decision register before treating anything in this file as
  adopted.
prefixes:
  linkml: https://w3id.org/linkml/
  enviromech: https://w3id.org/monarch-initiative/enviromech/
  dismech: https://dismech.monarchinitiative.org/
  aop.events: https://aopwiki.org/events/
  aop.stressor: https://aopwiki.org/stressors/
  PMID: http://www.ncbi.nlm.nih.gov/pubmed/
  dcterms: http://purl.org/dc/terms/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  CL: http://purl.obolibrary.org/obo/CL_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  comptox: https://comptox.epa.gov/dashboard/
default_prefix: enviromech
default_range: string

imports:
  - linkml:types
  # A vendored, unchanged copy of linkml-aop's aop_emod_linkml.yaml. The commit
  # and SHA-256 it was copied at are recorded in docs/mechmaker.md. To update,
  # replace the file and the record of it together; never edit it here.
  - aop_emod_linkml

classes:

  KeyEventAggregation:
    description: >-
      The section of a KeyEventRecord saying that its Key Event is aggregated from
      one or more nodes of an external knowledge base, with the curator's argument
      that the aggregation does not misrepresent the biology. The Event is the one
      in the enclosing record.

      An AOP simplifies a mechanism into a chain of measurable Key Events, so a Key
      Event is often broader than any one node in a mechanism graph such as a
      dismech pathograph, and several nodes may be lumped into it. This class
      records which nodes went in, what each one asserted in its own source, and
      how the set relates to the Event. It is not a statement about AOP-Wiki
      provenance: HarmonizedEvent tracks an AOP-Wiki Event back to the AOP-Wiki
      Events it was harmonized from, and this class is deliberately separate from
      it so that the two kinds of provenance are never mixed.

      Three checks belong to this class rather than to Event, and a validator or a
      reviewer should apply them to every record: (1) every source node sits at the
      same level of biological organization as the Event, or the mismatch is recorded
      in level_mismatch_note rather than silently resolved; (2) each source node's
      terms satisfy the Event's event components, read from the components rather
      than from the Event title, which may be narrower; (3) rationale says in the
      curator's own words why the lumped nodes are one measurable change.

      Aggregating two nodes that the source joins by a causal edge is allowed: an
      AOP simplifies, and a step whose two ends no assay separates sits below the
      resolution the pathway needs. The edge is kept in internal_edges so that the
      specificity the Event simplifies away stays recoverable from the record.
    attributes:
      aggregation_relation:
        description: How the set of source nodes, taken together, relates to the Event.
        range: AggregationRelationEnum
        required: true
      source_nodes:
        description: >-
          The nodes aggregated into the Event, each described as its source records
          it. At least one is required; a record with one node is a plain
          correspondence, and a record with several is a lumping.
        range: SourceNode
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
      rationale:
        description: >-
          Why these nodes are one measurable biological change, in the curator's
          own words. Required. A rationale that only restates the Event title or
          the aggregation_relation value fails review.
        required: true
      internal_edges:
        description: >-
          Causal edges the source draws between two of this record's source nodes.
          Every causal edge between two aggregated nodes should be listed, since
          the Event no longer shows it; an edge from an aggregated node to a node
          outside the record belongs to a Key Event Relationship instead.
        range: SourceEdge
        multivalued: true
        inlined: true
        inlined_as_list: true
      level_mismatch_note:
        description: >-
          Present only when a source node's level of biological organization
          differs from the Event's. States which node, which two levels, and which
          reading the evidence supports. Absence asserts that every source node
          sits at the Event's level.
      notes:

  SourceEdge:
    description: >-
      A causal edge between two nodes of an external knowledge base, as that source
      records it, kept on a KeyEventAggregation when both of its ends are aggregated
      into the same Event. Both ends are named by node_name and must match a
      source_nodes entry on the same record; LinkML cannot enforce that match, so
      it is a check for a validator script or a reviewer. The edge's evidence stays
      in the source and is not copied here.
    attributes:
      upstream_node:
        description: The node_name of the upstream end, exactly as in source_nodes.
        required: true
      downstream_node:
        description: The node_name of the downstream end, exactly as in source_nodes.
        required: true
      source_link_type:
        description: >-
          The source's own typing of the edge, verbatim, when it has one (for
          dismech, causal_link_type such as DIRECT or
          INDIRECT_KNOWN_INTERMEDIATES).
      description:
        description: What the source says the edge asserts, in the curator's summary.
      notes:

  SourceNode:
    description: >-
      One node of an external knowledge base as that source records it. The
      values here are copied from the source, not re-curated: the point of the
      class is to let a reader compare what the source asserted with what the
      Event asserts. Terms reuse the EMOD BiologicalProcess, BiologicalObject and
      BiologicalAction classes so the comparison with Event.event_components is
      computable.
    attributes:
      source_knowledge_base:
        description: The knowledge base the node comes from, for example dismech.
        required: true
      source_node_ref:
        description: >-
          The node's identity in the source, written in the source's own
          cross-entry reference grammar so it can be resolved there. For dismech
          this is the entity reference <entry>:<section>#<name>, for example
          Primary_Ciliary_Dyskinesia:pathophysiology#Ciliary Dysfunction, which
          is what dismech's attaches_to uses across files and what its
          entity_refs resolver checks. This is the key that maps a source node to
          the Event: two nodes from one entry are two distinct refs, and a
          pathophysiology node is distinguished from a phenotype of the same
          name. source_entry and node_name are its readable parts and must agree
          with it.
        required: true
      node_name:
        description: The node's name exactly as the source spells it.
        required: true
      source_entry:
        description: >-
          The entry within that knowledge base, for example a dismech disease or
          module slug such as Primary_Ciliary_Dyskinesia.
        required: true
      source_entry_uri:
        description: A resolvable URI for the entry, when the source publishes one.
        range: uri
      source_level:
        description: >-
          The level of biological organization as the source records it, verbatim
          (for dismech, the biological_scale value such as CELLULAR). Kept as a
          string because the source's vocabulary is not EMOD's.
      biological_organization_id:
        description: The source_level mapped onto EMOD's levels.
        range: LevelOfBiologicalOrganization
        inlined: true
      processes:
        description: Biological process terms the source binds to the node.
        range: BiologicalProcess
        multivalued: true
        inlined: true
        inlined_as_list: true
      objects:
        description: Biological object terms the source binds to the node, including cell type and anatomical location.
        range: BiologicalObject
        multivalued: true
        inlined: true
        inlined_as_list: true
      biological_action_id:
        description: >-
          The direction or kind of change the source asserts on the node, mapped
          onto EMOD's BiologicalActionEnum (for dismech, from the modifier on the
          bound process).
        range: BiologicalAction
        inlined: true
      source_confidence:
        description: >-
          The source's own confidence marking on the node, verbatim, when it has
          one (for dismech, mechanism_confidence). Absent means the source did not
          mark it, not that it is established.
      notes:

  KeyEventRecord:
    description: >-
      One Key Event, in one file under data/key_events/. The Event itself is an
      EMOD Event, unchanged; this class adds what EnviroMech needs around it: an
      identifier that resolves, where and when the Event was read from AOP-Wiki,
      and what a curator found when checking it.

      Whether the Event is a Molecular Initiating Event, an Adverse Outcome or an
      intermediate Key Event is not recorded here. That is its role within one
      AOP and belongs to the AOP's record. Observations are not listed here
      either: an ObservationRecord names the Events it bears on, and the list of
      Observations for an Event is derived from those records.
    attributes:
      id:
        identifier: true
        range: uriorcurie
        description: >-
          The Key Event's AOP-Wiki identifier as a CURIE, for example
          aop.events:1542. The prefix is the one Bioregistry registers for
          AOP-Wiki Key Events.
        pattern: "^aop\\.events:\\d+$"
        required: true
      status:
        description: Review state of this record.
        range: CurationStatusEnum
        required: true
      event:
        description: >-
          The Event, as an EMOD Event.
        range: Event
        inlined: true
        required: true
      aop_wiki_snapshot:
        description: >-
          The date of the AOP-Wiki XML export the Event was read from, as
          YYYY-MM-DD.
        range: date
        required: true
      source_uri:
        description: The Event's page on AOP-Wiki.
        range: uri
      level_screening:
        description: >-
          The outcome of screening the Event's level of biological organization
          against its own description, with the screen-aop-key-event skill.
        range: KeyEventScreening
        inlined: true
      aggregation:
        description: >-
          The nodes of an external knowledge base this Event is aggregated from,
          when that has been worked out.
        range: KeyEventAggregation
        inlined: true
      term_findings:
        description: >-
          Problems found with the ontology terms AOP-Wiki binds to the Event,
          one per entry: an obsolete term, a label that does not match, a term
          from an unexpected ontology. The Event block keeps what AOP-Wiki
          records; the finding is stated here.
        multivalued: true
      notes:

  KeyEventScreening:
    description: >-
      Whether a Key Event's assigned level of biological organization has been
      checked against its own description, and what was found.
    attributes:
      outcome:
        range: ScreeningOutcomeEnum
        required: true
      screened_on:
        description: The date the screen was run.
        range: date
      method:
        description: Which pass produced the outcome, and against which snapshot.
      note:

  ObservationRecord:
    description: >-
      One Observation, in one file under data/observations/: that a Causal
      Agent was observed, by a stated method, to change a biological object,
      process or phenotype in a stated direction, with the source quoted.

      An Observation can stand alone. With no Events named it is an
      exposure-outcome association with no known mechanism. With Events named it
      is evidence for a claim supporting those Key Events.

      What was observed is an EMOD Observation, unchanged. This class adds what
      EMOD's Observation does not carry: an identifier that resolves, the Causal
      Agent bound to an ontology term, a phenotype bound to an ontology term, and
      evidence items whose quotes are checked against the cited source.
    attributes:
      id:
        identifier: true
        range: uriorcurie
        description: A CURIE minted in the enviromech namespace.
        required: true
      title:
        description: The observation as one plain sentence.
        required: true
      status:
        description: Review state of this record.
        range: CurationStatusEnum
        required: true
      causal_agent:
        description: What the subjects were exposed to or treated with.
        range: CausalAgent
        inlined: true
        required: true
      asserted_relation:
        description: >-
          The relation the source asserts between the Causal Agent and what was
          observed, as a short phrase, for example "exposure correlated with",
          "directly toxic to", "used to treat".
        required: true
      observation:
        description: >-
          What was observed, as an EMOD Observation: the direction of change
          (biological_action_id), the object or process changed, the method
          (assay_id), and the Events it bears on (events, by Event id).
        range: Observation
        inlined: true
        required: true
      phenotype_term:
        description: >-
          The phenotype or disease observed, bound to an ontology term, when
          the observation is of one. EMOD's Observation.phenotype holds the
          same thing as a string.
        range: Term
        inlined: true
      evidence:
        description: >-
          The sources for this observation, each with an exact quote.
        range: EvidenceItem
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
      notes:

  CausalAgent:
    description: >-
      What subjects were exposed to or treated with in an Observation: a drug
      treatment, a chemical in the environment, or a biological entity applied
      in an experimental context. Named inline on each Observation; it has no
      record of its own. The list of Causal Agents in use is derived from the
      Observation records. EMOD's counterpart is Stressor.
    attributes:
      name:
        description: The agent's name as the curator writes it.
        required: true
      agent_type:
        range: CausalAgentTypeEnum
        required: true
      term:
        description: >-
          The ontology term for the agent, when one exists. Two Observations
          name the same Causal Agent when they bind the same term.
        range: Term
        inlined: true
      other_identifiers:
        description: >-
          Other identifiers for the agent, as CURIEs, for example an EPA
          CompTox identifier such as comptox:DTXSID4021395.
        range: uriorcurie
        multivalued: true
      aop_wiki_stressor:
        description: >-
          The agent's AOP-Wiki Stressor, as a CURIE such as aop.stressor:395,
          when AOP-Wiki lists it as one.
        range: uriorcurie

  Term:
    description: >-
      A reference to an ontology term. The label must be the ontology's own.
      The same shape as a mechmaker Term.
    attributes:
      id:
        description: The term's CURIE.
        range: uriorcurie
        required: true
      label:
        description: The ontology's own label for the term.
        slot_uri: rdfs:label
        required: true

  EvidenceItem:
    description: >-
      A citation that bears on a claim, with a verbatim quote from the source.
      The quote is checked against the cached source text by
      linkml-reference-validator; a paraphrase fails. The same shape as a
      mechmaker EvidenceItem. Distinct from EMOD's Evidence, which links two
      Observations to a Citation for a Key Event Relationship.
    slots:
      - reference
      - reference_title
      - supports
      - evidence_source
      - snippet
      - explanation

# Top-level slots, not attributes: linkml-reference-validator finds the
# reference and the quote through these slots' `implements` values.
slots:
  reference:
    description: The cited source, as a CURIE such as PMID:12345678.
    pattern: "^[A-Za-z][A-Za-z0-9_]*:[^\\s]+$"
    required: true
    implements:
      - linkml:authoritative_reference
  reference_title:
    description: Title of the cited source, copied from the reference cache.
    recommended: true
    implements:
      - dcterms:title
  supports:
    description: Which way the evidence cuts relative to the claim.
    range: EvidenceSupportEnum
    required: true
  evidence_source:
    description: The kind of system the evidence comes from.
    range: EvidenceSourceEnum
  snippet:
    description: >-
      An exact quote from the cited source. Paraphrase goes in explanation.
    required: true
    implements:
      - linkml:excerpt
  explanation:
    description: How the quote bears on the claim.

enums:
  AggregationRelationEnum:
    description: How a set of source nodes relates to the Event they are aggregated into.
    permissible_values:
      constitutes:
        description: >-
          The source nodes, taken together, are the Event. Nothing the Event
          asserts lies outside their union, and nothing they assert lies outside
          the Event.
      narrower_than:
        description: >-
          The source nodes are each a narrower case of the Event. The Event
          covers biology the nodes do not assert.

  CurationStatusEnum:
    description: Review state of a record. The same values as a mechmaker Mech.
    permissible_values:
      DRAFT:
        description: Incomplete. Not ready for review.
      PROPOSED:
        description: Complete and validated, awaiting human review.
      REVIEWED:
        description: A person reviewed and accepted it. Only a person sets this.
      DEPRECATED:
        description: Kept for provenance. Not current.

  ScreeningOutcomeEnum:
    description: The outcome of screening a Key Event's level of biological organization.
    permissible_values:
      NOT_SCREENED:
        description: No screen has been run. The level is as AOP-Wiki assigns it.
      LEVEL_FITS:
        description: The Event's description fits its assigned level.
      LEVEL_DISPUTED:
        description: The description reads as another level, or spans levels.
      LEVEL_UNCONFIRMED:
        description: The Event has no description, or the screen could not tell.

  CausalAgentTypeEnum:
    description: The kind of thing a Causal Agent is.
    permissible_values:
      DRUG_TREATMENT:
        description: A drug given as treatment.
      ENVIRONMENTAL_CHEMICAL:
        description: A chemical in the environment, such as a pesticide or an air pollutant.
      BIOLOGICAL_ENTITY:
        description: A biological entity applied in an experimental context.

  EvidenceSupportEnum:
    description: Direction of an evidence item relative to its claim. Says nothing about strength.
    permissible_values:
      SUPPORT:
        description: The source supports the claim.
      REFUTE:
        description: The source contradicts the claim.
      PARTIAL:
        description: The source supports the claim in part or with caveats.
      NO_EVIDENCE:
        description: The source is relevant but does not bear on the claim.

  EvidenceSourceEnum:
    description: The kind of system the evidence comes from.
    permissible_values:
      HUMAN_CLINICAL:
        description: Human observations, including patients, cohorts, trials and epidemiology.
      MODEL_ORGANISM:
        description: In vivo evidence from a non-human animal.
      IN_VITRO:
        description: Cell culture, including iPSC-derived cells, organoids and biochemical assays.
      COMPUTATIONAL:
        description: In silico or modelling studies.
      OTHER:
        description: Evidence not fitting the values above.
