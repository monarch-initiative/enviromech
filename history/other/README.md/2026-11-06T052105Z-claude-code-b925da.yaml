  summary: Give the README the published documentation site URL
  details: 'The README''s Documentation section described how to build the site but never

    said where it is published, which is what a reader wants from that heading.

    Added the site URL and the record browser path under it, read from

    mkdocs.yml''s site_url and from the nav''s records/index.html entry rather

    than guessed. The local-preview command was ''mkdocs serve''; the site''s

    schema reference and record pages are generated by ''just docs-build'', so a

    bare mkdocs serve on a clean checkout serves only the hand-written pages.

    Changed it to ''just docs-serve'' and said what the bare command omits.


    Not verified from this session: that the site is actually live. The

    monarch-initiative.github.io host is not allowed here and the Pages and

    Actions APIs are blocked through this proxy, so the URL is the one the

    repository configures, not one I fetched. Settings > Pages > Source must be

    ''GitHub Actions'' and the Docs workflow must have a green run on main, both

    of which need checking by a person.


    ''just qc'' passes, 13 gates.'
