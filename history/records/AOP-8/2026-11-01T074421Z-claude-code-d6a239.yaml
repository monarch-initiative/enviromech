- type: CREATE
  outcome: changed
  summary: Create the AOP 8 record, its nine Key Events and ten event components
  details: 'AOP 8 recorded from the 2026-11-01 AOP-Wiki XML export, read with aop_wiki_cli: one AopRecord,
    nine KeyEventRecords (239, 295, 961, 281, 280, 756, 757, 758, 319) and the ten event components they
    need (EC-0014 to EC-0023). Key Event records were generated by scripts/key_event_from_snapshot.py
    so their structured properties and text are the export''s own.


    Roles were taken from the export''s molecular-initiating-event, key-events and adverse-outcome elements
    rather than inferred: one MIE (KE 239) and one Adverse Outcome (KE 319), with the other seven listed
    as Key Events. The eight Key Event Relationships (2482, 2478, 2270, 312, 746, 747, 749, 2484) are
    all adjacent and form one linear chain, their endpoints read from the KER cache.


    Two findings about the source record, both recorded in the AOP record''s notes. Its Molecular Initiating
    Event is the pregnane-X receptor alone (NR1I2); neither AhR nor CAR appears among the nine Key Events,
    although AOP 8 is usually summarised as initiating at all three. And the chain reaches the Adverse
    Outcome, loss of cochlear function, through three hippocampal Key Events, with KER 2484 joining altered
    hippocampal physiology directly to that loss - not an established causal step, and better read as
    a placeholder in a record that is Under Development and Open for adoption.


    This also corrects the OpenScientist evaluation committed earlier on this branch, whose pathway section
    describes a six-node chain with a combined AhR/CAR/PXR initiating event and an ''altered cochlear
    development'' Key Event. Neither matches the export: there is no such Key Event, there is no hepatic
    efflux Key Event for its merge recommendation to apply to, and the three hippocampal events are absent
    from the report entirely. The report''s own provenance note already recorded that its transporter
    recommendation was a model prior confirmed by a search written to find it; this is the same shape
    of defect in its pathway reconstruction. Issue #13 needs the same correction and has not had it yet.


    The schema gains the PR and MP prefixes, required by these event components and previously undeclared.
    Both expansions were read from the IRIs OLS returns for PR:000011397 and MP:0005475, whose labels
    match the export''s terms exactly.


    Every Key Event carries level_screening NOT_SCREENED. The levels were not screened, and at least two
    look worth screening: KE 961 and KE 281 are recorded at Tissue level for serum thyroxine quantities
    while KE 280, thyroxine in neuronal tissue, is at Organ.


    Validation: linkml-validate reports no issues for AopRecord, KeyEventRecord and EventComponentRecord;
    scripts/check_aops.py 3 records, 0 problems; scripts/check_ids.py 23 event components, 0 problems.
    The term labels were not re-resolved against their ontologies beyond the two prefix checks; term_findings
    is empty on all nine records and no crosswalk to dismech nodes was attempted.'
