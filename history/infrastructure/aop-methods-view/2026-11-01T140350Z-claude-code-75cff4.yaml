    reworked into one drawer with two views, switched by Pathway/Methods; Pathway is unchanged. In Methods,
    Key Events join their assays and shared methods directly, methods join their nodes with dismech''s
    relationship, and a SAME_READOUT_OTHER_SYSTEM match is a dashed line. For AOP 40: 10 assays only,
    3 in both (h-CLAT, GARDskin, LLNA), 5 dismech models only. Checked in Chromium at 1440 px light and
    dark and 390 px: no script errors, no page overflow; the figure may widen past the text column to
    1240 px. 5 new tests.'
