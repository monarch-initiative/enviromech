events:
- type: EDIT
  outcome: changed
  summary: Give the record browser a list view per record kind, beside the mixed index
  details: 'The browser rendered one table over every record, with columns from conf/site.yaml''s index_columns,
    so an AOP, a Key Event and an Observation were described by the same four. render.py now builds one
    list view per record kind in render.KINDS (AOP, Key Event, Observation) and keeps the mixed view as
    the front page, because filtering across kinds has its uses; a kind with no records gets no view and
    no dead link to one. Each kind''s columns come from the new kind_columns setting, falling back to
    index_columns. A column names a field of the record and may reach into a nested one with dots; render.list_cells
    derives the rest - how many Key Events, Key Event Relationships, dismech nodes and dismech models
    a record has, a Key Event''s AOP-Wiki id, biological level and level screening outcome, and the AOPs
    it appears in with its role in each, named by the AOP''s short name. templates/index.html became templates/list.html,
    rendered once per view to index.html and to aops.html, key-events.html and observations.html; every
    list page and every record page carries the view links, with the one shown marked. Assays, test guidelines
    and event components stay out: they have no record pages, so their rows would link nowhere, and report.py
    does not count them, so a view would disagree with docs/corpus.md. 15 new tests. Looked at all four
    pages in Chromium at 1200 px light and dark and at 390 px.'
- type: EDIT
  outcome: changed
  summary: >-
    Guard the Key Event match and the dismech model count, and build the browser lazily
    in the tests
  details: >-
    Copilot read two reachable defects in list_cells. EMOD leaves event_id optional on an
    AOP's event member, so a member naming no Key Event looked that None up in a map that
    could itself hold a None key, for a Key Event record with no event.id, and linked the
    AOP to that unrelated record; the map now drops records with no id and a member with
    no event_id matches nothing. A source node's model with no model_ref put None in the
    set behind dismech models and inflated the count by one; falsy refs are excluded. The
    test module built the whole browser at import, so pytest paid for it during
    collection even when no test using it was selected; it is behind a cached function
    now. Two tests, each checked to fail against the previous commit.
- type: EDIT
  outcome: changed
  summary: >-
    Rebase onto the cross-link fix and build the list-view map with its shared
    Key Event index
  details: >-
    PR 57 landed first, adding key_events_by_event_id and guarding both cross-linking
    passes. Both branches had inserted new code immediately before cross_link, so this
    one was rebased onto the new main and the two insertions kept side by side. list_cells
    had been building its own map from AOP-Wiki id to Key Event record, with its own copy
    of the same guard; it now derives that map from key_events_by_event_id, so the rule
    that a record with no event.id is nobody's match lives in one place. No list view,
    column or derived value changed. 245 tests pass, ruff is clean and just qc is green.
