  summary: Commit the AOP 8 OpenScientist evaluation and its 20 sources
  details: 'Preserves the provenance behind issue #13: an OpenScientist evaluation of AOP-Wiki AOP 8 (hepatic
    nuclear receptor activation, thyroid hormone catabolism, developmental hearing loss), committed as
    a dated working note with its cited sources.


    The report body is byte-identical to the provider output. It carries a header stating that it is AI-generated
    and unreviewed and recording two things found by checking its citations: the Baze 2025 quote in Finding
    9 is truncated mid-clause and cannot be used as a snippet, and the report''s framing of human relevance
    is weaker than it reads, because that study''s human result is negative (no effect in human hepatocytes
    at any concentration). Those two facts are why AOP 8 is recorded here as a hypothesis rather than
    in dismech as disease mechanism.


    Twenty references are cached. Eighteen are the evaluation''s own bibliography, all resolved by dismech''s
    linkml-reference-validator 0.3.0 with none unresolved. Two more (PMID:29535325 Sharlin 2018, PMID:38417253
    Garcia-Aldea 2024) back a later curator review which partly reverses the evaluation''s headline recommendation:
    carrier-mediated thyroid hormone uptake should sit on the serum-to-tissue relationship as a modulating
    factor and a network link to AOP 610, not as an inserted Key Event, and the cochlear transporter pair
    is MCT8 with MCT10 rather than MCT8/OATP1C1. Both were read as full text and support that review as
    written.


    Caveats for a reviewer. The cache files were generated by dismech''s reference fetcher rather than
    EnviroMech''s; the formats are identical, verified against the three cache files already in this repository,
    but they were not written by this repository''s validators. No EnviroMech record is created: the branch
    holds provenance only, and the AOP 8 record itself remains unwritten. Since this work began, the repository
    has gained AOP, Key Event and event-component record kinds plus the crosswalk skill, so AOP 8 could
    now be curated as an AopRecord with its Key Events rather than as a working note; that decision is
    open. The run''s per-iteration transcripts and figure are not committed and are recoverable from the
    provider by job id while it lasts.


    Outcome is needs_followup for those two reasons: no record written, and the curator review''s conclusions
    are recorded in issue #13 but not in any repository file.'
