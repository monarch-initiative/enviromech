id: enviromech:assay-0008
assay:
  id: 8
  title: KeratinoSens
  description: Luciferase reporter under an antioxidant response element in an immortalized
    human keratinocyte line, reading Keap1-Nrf2-ARE pathway activation.
  events:
  - 826
  test_guidelines:
  - 2
mapping_reference: PMID:38385441
mapping_extraction: https://github.com/monarch-initiative/dismech/blob/a0dc2ff5bc7ef0cfad94825495d805aadbbdedf6/templates/skin_sensitization_aop_models.md
model_matches:
- model_ref: Contact_Dermatitis:experimental_models#Keratinocyte Keap1-Nrf2-ARE sensitizer-response models
  match: SAME_READOUT_OTHER_SYSTEM
  notes: >-
    dismech's model reads Nrf2 activation in primary and N/TERT keratinocytes and
    the Leiden and N/TERT reconstructed epidermis, and names KeratinoSens as a TG
