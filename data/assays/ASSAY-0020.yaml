assay:
  id: 20
  title: "α-Sens®"
  description: "The third ARE-Nrf2 luciferase method of OECD TG 442D: a human keratinocyte line with Firefly luciferase under a quadruplicated AKR1C2 antioxidant response element and a Renilla luciferase for viability, read in the same cells."
  events:
  - 826
  test_guidelines:
  - 2
mapping_reference: PMID:32335162
