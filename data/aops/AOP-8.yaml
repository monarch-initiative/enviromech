# AOP-Wiki AOP 8. Its title, Key Events with their roles, and Key Event
# Relationships read from the 2026-11-01 AOP-Wiki XML export with aop_wiki_cli.
# The export marks one Molecular Initiating Event and one Adverse Outcome; the
# other seven Key Events are listed under the AOP's key-events element.
