aop:
  id: 8
  title: >-
    Upregulation of Thyroid Hormone Catabolism via Activation of Hepatic Nuclear
    Receptors, and Subsequent Adverse Neurodevelopmental Outcomes in Mammals
  short_name: Nuclear receptor induced TH Catabolism and Developmental Hearing Loss
  events:
  - event_id: 239  # Activation, Pregnane-X receptor, NR1I2
    type: MolecularInitiatingEvent
  - event_id: 295  # Induction, Upregulation of glucuronyltransferase activity
    type: KeyEvent
  - event_id: 961  # Increased, Clearance of thyroxine from serum
    type: KeyEvent
  - event_id: 281  # Thyroxine (T4) in serum, Decreased
    type: KeyEvent
  - event_id: 280  # Thyroxine (T4) in neuronal tissue, Decreased
    type: KeyEvent
  - event_id: 756  # Hippocampal gene expression, Altered
