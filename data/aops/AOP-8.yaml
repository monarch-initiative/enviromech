notes: >-
  The eight Key Event Relationships form one linear chain, every one adjacent:
  KE 239 -> 295 -> 961 -> 281 -> 280 -> 756 -> 757 -> 758 -> 319. Those links
  will be recorded in the Key Event Relationship records.


  Two features of the source record are worth a reader's attention, because
  both differ from how this AOP is usually described.


  The Molecular Initiating Event is the pregnane-X receptor alone (NR1I2). AOP
  8 is often summarised as initiating at AhR, CAR and PXR together; the export
  names only PXR, and neither AhR nor CAR appears among its nine Key Events.


  The chain reaches the Adverse Outcome, loss of cochlear function, through
  three hippocampal Key Events, and KER 2484 joins altered hippocampal
  physiology directly to that loss. Hippocampal physiology is not an
  established cause of cochlear dysfunction, so this step reads as a
  placeholder in a pathway that has two outcome arms - a neurodevelopmental one
  the title names and an auditory one the short name names - rather than as a
  mechanistic claim. The AOP is "Under Development" and "Open for adoption",
  so this is an unfinished record and not a settled position.
