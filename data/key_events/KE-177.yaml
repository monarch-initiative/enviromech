    Rhodamine 123 Assay

    Measuring Mitochondrial membrane potential (MMP) and its collapse

    (Shaki et al., 2012)

    Mitochondrial uptake of cationic fluorescent dye, rhodamine 123, is used for
    estimation of mitochondrial membrane potential. The fluorescence was monitored using
    Schimadzou RF-5000U fluorescence spectrophotometer at the excitation and emission
    wavelength of 490 nm and 535 nm, respectively.

    50, 100 and 500 μM of uranyl acetate

    Short / easy

    Medium accurancy

    TMRE fluorescence Assay

    Measuring Mitochondrial permeability transition pore (mPTP) opening

    (Huser et al., 1998)

    Laser scanning confocal microscopy in combination with the potentiometric
    fluorescence dye tetramethylrhodamine ethyl ester to monitor relative changes in
    membrane potential in single isolated cardiac mitochondria. The cationic dye
    distributes across the membrane in a voltage-dependent manner. Therefore, the large
    potential gradient across the inner mitochondrial membrane results in the
    accumulation of the fluorescent dye within the matrix compartment. Rapid
    depolarizations are caused by the opening of the transition pore.

    1 µM cyclosporin A

    Short / easy

    Low accurancy

    GSH / GSSG Determination Assay

    Measuring cellular glutathione (GSH) status; ratio of GSH/GSSG

    (Owen & Butterfield, 2010; Shaki et al., 2013)

    GSH and GSSG levels are determinted biochemically with DTNB (Ellman’s reagent). The
    developed yellow color was read at 412 nm on a spectrophotometer.

    100 µM uranyl acetate

    Short / easy

    Low accurancy

    TBARS Assay

    Quantification of lipid peroxidation

    (Yuan et al., 2016)

    MDA content, a product of lipid peroxidation, was measured using a thiobarbituric
    acid reactive substances (TBARS) assay. Briefly, the kidney cells were collected in
    1 ml PBS buffer solution (pH 7.4) and sonicated. MDA reacts with thiobarbituric acid
    forming a colored product which can be measured at an absorbance of 532 nm.

    200, 400, 800 µM uranyl acetate

    Medium / medium

    High accurancy

    Aequorin-based bioluminescence assay

    Increase in mitochondrial Ca 2+ influx

    (Pozzan & Rudolf, 2009)

    Together with GFP, the aequorin moiety acts as Ca 2+ sensor in vivo , which delivers
    emission energy to the GFP acceptor molecule in a BRET (Bioluminescence Resonance
    Energy Transfer) process; the Ca2+ can then be visualized with fluorescence
    microscopy.

    Short / easy

    Low accurancy

    Western blot & immunostaining analyses

    Measuring cytochrome c release

    (Chen et al., 2000)

    Examining the redistribution of Cyto c in cytosolic and mitochondrial cellular
    fractions. Cells are homogenized and centrifuged, then prepared for immunoblots.
    Cellular fractions were washed in PBS and lysed in 1% NP-40 buffer. Cellular
    proteins were separated by SDS–PAGE, transferred onto nitrocellulose membranes,
    probed using immunoblot analyses with antibodies specific to cyto c (6581A for
    Western and 65971A for immunostaining; Pharmingen)

    Short / easy

    Medium accurancy

    Quantikine Rat/Mouse Cytochrome c Immunoassay

    Measuring cytochrome c release

    (Shaki et al., 2012)

    Cytochrome C release was measured a monoclonal antibody specific for rat/mouse
    cytochrome c was precoated onto the microplate. Seventy-five microliter of conjugate
    (containing mono- clonal antibody specific for cytochrome c conjugated to
    horseradish peroxidase). After 2 h of incubation, the substrate solution (100 μl)
    was added to each well and incubated for 30 min. After 100 μl of the stop solution
    was added to each well; the optical density of each well was determined by the
    aforementioned microplate spectrophotometer set to 450 nm.

    Short / easy

    Low accurancy

    Membrane potential and cell viability – Flow Cytometry

    Measuring cytochrome c release

    (Kruidering et al., 1997)

    “Dc and viability were determined by analyzing the R123 and propidium iodide
    fluorescence intensity with a FACScan flow cytometer (Becton Dickinson, San Jose,
    CA) equipped with an argon laser, with the Lysis software program (Becton
    Dickinson). R123 is a cationic dye that accumulates in the negatively charged inner
    side of the mitochondria. When the potential drops, less R123 accumulates in the
    mitochondria, which results in a lower fluorescence signal. The potential was
    measured as follows: at the indicated times, a 500-ml sample of the cell suspension
    was taken and transferred to an Eppendorf minivial. To this sample, 100 ml of 6 mM
    R123 in buffer D was added. After incubation for 10 min at 37°C, the cell suspension
    was centrifuged for 5 min at 80 3 g . The cell pellet was resuspended in 200 ml of
    buffer D, containing 0.2 mM R123 and 10 mM propidium iodide, to prevent loss of R123
    and to stain nonviable cells, respectively. The samples were transferred to FACScan
    tubes and analyzed immediately. Analysis was performed at a flow rate of

    60 ml/min. R123 fluorescence was detected by the FL1 detector with an emission
    detection limit below 560 nm. Propidium iodide fluorescence was detected by the FL3
    detector, with emission detection above 620 nm. Per sample 3,000 to 5,000 cells were
    counted (Van de Water et al. , 1993)”

    Short / easy

    Medium accurancy
