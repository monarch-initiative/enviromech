  note: >-
    Flagged: AOP-Wiki assigns Organ, and the description has no Organ-level
    words while it has Individual-level ones (individual, individuals,
    subject, clinical). The description defines the Event as a state of the
    person: "an individual will be said to be sensitised" on reaching a
    threshold number of hapten-specific T cells, and "a sensitised subject has
    the capacity to mount a more accelerated secondary response". The skin is
    where the response is later elicited, not where sensitisation happens. The
    description reads as Individual.
notes: >-
  No aggregation. This is the adverse outcome: being sensitised, reached at
  the end of induction. dismech's Contact_Dermatitis pathograph has no node
  for it. Its node after Allergen-specific T-cell priming is
  Re-exposure-driven effector T-cell recruitment, which is elicitation, and
  dismech records the missing outcome node as the knowledge gap
  no_node_for_integrated_outcome_prediction. The disease term of the entry,
  MONDO:0005480 contact dermatitis, is not it either: dermatitis is what a
  sensitised person develops on re-exposure. So no dismech node or entry
  corresponds to this Event, and that is the finding.
