status: DRAFT
aop_wiki_snapshot: "2026-10-03"
source_uri: https://aopwiki.org/events/827
event:
  id: 827
  title: "sensitisation, skin"
  short_name: "sensitisation, skin"
  biological_organization_id:
    term: Organ
  assays:
  - 15  # Human repeat insult patch test (HRIPT)
  - 16  # Guinea pig maximization test (GPMT)
  - 17  # Buehler test
  test_guidelines:
  - 7  # OECD TG 406
  definition: >-
    Skin sensitisation is an immunological process that is described in two phases:
    the induction of sensitisation and the subsequent elicitation of the immune
    reaction. A sensitised subject has the capacity to mount a more accelerated
    secondary response to the same chemical. Upon reaching an unknown threshold
    number of hapten-specific T cells an individual will be said to be sensitised
    and will elicit a T cell-mediated eczematous skin reaction (termed allergic
    contact dermatitis, ACD) at the site of sensitiser re-exposure. Above the
    threshold, the severity of the adverse effect is assumed to increase
    proportionally to the dose, so the total dose per area of skin (e.g. μg/cm2) is
    the critical exposure determinant. In this regard, animal data is consistent
    with human clinical data [1]. The allergic reaction causes inflammation of the
    skin manifested by varying degrees of erythema, oedema, and vesiculation. It
    takes up to one week or more for individuals to develop specific sensitivity to
    a new allergen following exposure. An individual who never has been sensitised
    to a substance may develop only a mild dermatitis 2 weeks following the initial
    exposure but typically develops severe dermatitis within 1-2 days of the second
    and subsequent exposures [2].
  measured_or_detected: >-
    [3] Human sensitisation testing is conducted with the Human Repeat Insult Patch
    Test (HRIPT), as described by McNamee et al. [4]; [5]. Skin biopsy may help to
    confirm the diagnosis and exclude other disorders.

    Animal models have been developed to assess the sensitisation potential of
    chemicals. Adler et al. (2011) have reviewed animal test methods for skin
    sensitisation [6]. Briefly, among these in vivo assays are the guinea-pig
    occluded patch test [7]; [8], the Magnusson-Kligman guinea pig maximization test
    [7]; [9]; [10], and the murine Local Lymph Node Assay [11]; [12]; [13]. Using
    LLNA data, sensitisers can be grouped into potency groups (e.g. extreme, strong,
    moderate, weak and non-sensitisers). However, as noted by Basketter et al. [14],
    the LLNA is not without limitations.
