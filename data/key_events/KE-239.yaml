  definition: >-
    Pregnane X receptor (PXR), also known as steroid NR subfamily 1, group I, member
    2 (NR1I2), is a nuclear receptor that can be activated by pregnenolone and
    progesterone and many chemicals due to low specificity; once activated it binds
    to Retinoid X receptor (RXR) and increases upregulation of target genes (Mellor
    et al. 2016). PXR has an important role in lipid homeostasis by regulating the
    rate of lipid intake particularly through activation of cluster of
    differentiation 36, also known as platelet glycoprotein 4 [(CD36) (Zhou et al.
    2006; Gwag et al. 2019)].
  measured_or_detected: >-
    Effects of Pregnane X receptor (PXR) activation on expression of downstream
    genes can be investigating using transcriptomics and/or RT-qPCR approaches. The
    following ToxCast assays measure PXR activation: ATG_PXRE_CIS; ATG_PXR_TRANS;
    TOX21_PXR_agonist; ATG_mPXR_XSP2; NVS_NR_hPXR (U.S. EPA 2024). Indigo
    Biosciences sells a commercial assay for human PXR activation (INDIGO
    Biosciences 2024).
