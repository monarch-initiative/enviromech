  definition: >-
    T-cells are typically affected by protein-hapten complexes presented by
    dendritic cells on Major Histocompatibility Complex (MHC) molecules. Molecular
    understanding of this process has improved in recent years (see [1]). Briefly,
    MHC molecules are membrane proteins which present the small peptide antigens
    placed in a “groove” of the MHC molecule during its intracellular synthesis and
    transport to the cell surface. In the context of the MHC molecular on the cell
    surface, the small peptide antigen is recognized via the T-cell receptors as
    self or non-self (e.g. foreign). If this peptide is a foreign peptide, such as
    part of a protein-hapten complex, the T-cell will be activated to form a memory
    T-cell, which subsequently proliferates. If reactivated upon presentation by
    skin dendritic cells, these memory T-cells will induce allergic contact
    dermatitis [2].
  measured_or_detected: >-
    Methods that have been previously reviewed and approved by a recognized
    authority should be included in the Overview section above. All other methods,
    including those well established in the published literature, should be
    described here. Consider the following criteria when describing each method: 1.
    Is the assay fit for purpose? 2. Is the assay directly or indirectly (i.e. a
    surrogate) related to a key event relevant to the final adverse effect in
    question? 3. Is the assay repeatable? 4. Is the assay reproducible?

    Most protocols recognize the importance of the process of antigen-presentation,
    so in vitro T-cell-based assays are typically co-cultures of allergen-treated
    dendritic cells and modified T-lymphocytes with expression of selected
    biomarkers (e.g. interferon gamma), or T-cell proliferation being the reported
    outcome. Much of this work has been reviewed by Martin et al [1]. It should be
    remembered that lymph node cell proliferation is the basis for the in vivo mouse
    Local Lymph Node Assay (LLNA). OECD TG 429 is the validated test guideline for
    the Skin Sensitisation: Local Lymph Node Assay [3] together with its two
    non-radioactive modifications (LLNA-DA TG442A [4] and LLNA-BrdU ELISA TG 442B
    [5]).

    Human T cell proliferation and DC and T cell cytokine profiles produced in
    response to chemical respiratory stimuli have been measured in vitro. (Holden et
    al., 2008, Bernstein et al., 2011)

