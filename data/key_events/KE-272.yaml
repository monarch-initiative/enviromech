      recorded. Its description: "During sensitization, antigen-presenting
      cells prime allergen-specific T cells, establishing the adaptive immune
      memory required for later flares."
  rationale: >-
    The node and the Event share their central component: activation of T
    cells by antigen-presenting cells carrying the hapten, bound in both to
    GO:0042110 T cell activation. The node is narrower in its T cells, naming
    CD8-positive alpha-beta T cells where the Event names T cells and memory T
    cells, because dismech curates the CD8 effector arm of allergic contact
    dermatitis. It is also narrower in what it asserts: it binds no
    proliferation process, while the Event's second component is proliferation
    of memory T cells. On its T-cell side, then, the node is narrower than the
    Event. It also binds dendritic cell antigen processing and presentation,
    which in AOP 40 falls on the upstream side, in KE 398 and KER 379; it is
    part of the node because priming is named from the T cell's side but needs
    the presenting cell. That process lies outside this Event, so the node
    asserts biology the Event does not, and the relation is overlaps rather
    than nodes_narrower_than_event. Neither side contains the other: each
    asserts something the other does not, so nodes_broader_than_event is
    equally wrong. This is overlaps in its strict sense, not the mixed-set
    fallback KE 398 uses it for, and it would stay overlaps if the relation
    were recorded per source node.
  level_mismatch_note: >-
    The node is CELLULAR; the Event is Organ in AOP-Wiki. The evidence
    supports Cellular: the Event's description and both of its components are
    about T cells, and this record's level screen disputes the Organ
    assignment. The mismatch is read as an error in AOP-Wiki's level, not as a
    modelling difference between the two knowledge bases.
  notes: >-
    KE 272 sits in AOPs 39 and 40. The aggregation is asserted for the Event,
    not for either pathway.
