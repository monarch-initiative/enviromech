level_screening:
  outcome: LEVEL_DISPUTED
  method: >-
    event-content-internal-alignment keyword pass, aop_wiki_cli at 0bcc052, against the 2026-10-03 snapshot. The model review (event-level-llm-review) was not run: no Anthropic credentials were available.
  screened_on: "2026-10-31"
  note: >-
    Flagged: AOP-Wiki assigns Organ, and the description has no Organ-level
    words while it has Cellular-level ones. The description is of a change in
    T cells: recognition of a hapten-modified peptide on MHC by the T-cell
    receptor, activation to a memory T cell, and proliferation. Both event
    components bind a cell-level process to a cell type (T cell activation in
    T cell; cell proliferation in memory T cell). The lymph node, the organ
    term, is where the change happens, and is also where the LLNA measures it;
    the Handbook places an Event at the level where the change happens, which
    here is the cell. The description reads as Cellular.
