level_screening:
  outcome: LEVEL_FITS
  method: >-
    event-content-internal-alignment keyword pass, aop_wiki_cli at 0bcc052, against the 2026-10-03 snapshot. The model review (event-level-llm-review) was not run: no Anthropic credentials were available.
  screened_on: "2026-10-31"
  note: >-
    No finding: the description carries words for the Molecular level. It
    describes the covalent reaction of an electrophile with nucleophilic sites
    in amino acid residues, which is a change in a molecule.
term_findings:
- >-
  The biological object CHEBI:59739 is labelled "electrophilic reagant" in
  AOP-Wiki; ChEBI's label is "electrophilic reagent". Checked against OLS on
  2026-10-31.
- >-
  The biological process GO:0005515 protein binding is a child of GO:0005488
  binding, which GO defines as "the selective, non-covalent, often
  stoichiometric, interaction of a molecule with one or more specific sites on
  another molecule". So the component term asserts non-covalent binding, where
  the Event is covalent binding. GO has no term for non-enzymatic covalent
  modification of a protein by a xenobiotic electrophile, which is also why
  dismech leaves its node unbound. Checked against OLS on 2026-11-01.
- >-
  The biological object is the class of the stressor, an electrophilic
  reagent, rather than the protein it binds. The Event's description says the
  target protein is not identified and is not considered critical.
aggregation:
  aggregation_relation: narrower_than
  source_nodes:
  - source_knowledge_base: dismech
    source_node_ref: Contact_Dermatitis:pathophysiology#Covalent hapten-protein adduct formation
    source_entry: Contact_Dermatitis
    source_entry_uri: https://dismech.monarchinitiative.org/pages/disorders/Contact_Dermatitis.html
    node_name: Covalent hapten-protein adduct formation
    source_level: MOLECULAR
    biological_organization_id:
      term: Molecular
    notes: >-
      dismech binds no process, chemical or modifier to the node, so no terms
      and no biological action are recorded. Its notes give the reason: GO has
      no term for non-enzymatic covalent modification of protein by a
      xenobiotic electrophile, GO:0008213 protein alkylation does not cover
      the arylating electrophiles its evidence uses, and CHEBI:59174 hapten is
      a role outside the entry's chemical enum. Its description: "A reactive
      small chemical forms a covalent bond with a skin protein, generating the
      hapten-protein adduct that downstream innate and adaptive responses
      recognize."
  rationale: >-
    The node and the Event describe the same molecular change: an electrophilic
    chemical forms a covalent bond with a protein, giving a hapten-protein
    adduct. Neither side can be compared on terms. The node binds none, and the
    Event's one component pairs GO:0005515 protein binding, which GO defines as
    non-covalent, with the stressor class CHEBI:59739 electrophilic reagent
    rather than with the protein that is modified. The comparison rests on the
    two descriptions, which agree that the protein target is not identified:
    AOP-Wiki says identifying it is not considered critical, and dismech says
    which epidermal protein must be modified remains unresolved. The node is
    narrower in where the protein is. It is the adduct with a skin protein in
    allergic contact dermatitis, while the Event names a eukaryotic cell and
    is also the initiating event of AOP 39, which leads to allergic
    respiratory hypersensitivity; its measurement text covers respiratory
    sensitisers as well as skin ones. So the node is a narrower case of the
    Event.
  notes: >-
    KE 396 sits in AOPs 39 and 40. The aggregation is asserted for the Event,
    not for either pathway. dismech records the metal route that does not pass
    through covalent binding, nickel and cobalt coordinating TLR4, as the
    knowledge gap no_node_for_non_covalent_metal_initiation; it is outside this
    Event.
