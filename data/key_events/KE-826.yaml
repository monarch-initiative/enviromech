    notes: >-
      Its description: the hapten acts as a danger signal, the NLRP3 and ASC
      inflammasome assembles and activates caspase-1, and mature IL-1beta and
      IL-18 are released. dismech curates it as running in parallel with the
      electrophile-sensing arm, not downstream of it. The node is more specific
      than the Event in three ways. It binds IL-1beta production (GO:0032611)
      beside IL-18 production (GO:0032621), where the Event's definition names
      IL-18 alone as its example of a pro-inflammatory cytokine. It binds NLRP3
      inflammasome complex assembly (GO:0044546) and inflammasome-mediated
      signalling (GO:0141084) as processes, where the Event describes
      inflammasome activation in prose and binds neither. And its model, the
      NALP3- and ASC-deficient mouse, perturbs the inflammasome step that
      matures both cytokines, so it does not separate them.
  rationale: >-
    The Event's definition describes two responses of keratinocytes to the
    hapten-protein complex: inflammasome activation with caspase-1 cleavage of
    IL-18, and induction of the Keap1-Nrf2-ARE cytoprotective pathway. dismech
    curates these as two parallel nodes, both driven by the hapten rather than
    by barrier injury. Both bind GO:0032980 keratinocyte activation, increased,
    in keratinocytes, which is the Event's first component. The inflammasome
    node carries the second component, cytokine production involved in
    inflammatory response, through IL-1beta and IL-18 production; that link
    is read from the descriptions, since GO places both terms under cytokine
    production and not under GO:0002534. The sensing node's GO:0062197
    cellular response to chemical stress is in neither component, but it is
    the Nrf2-ARE induction the Event's definition names, and the OECD TG 442D
    assay the Event lists in its measurement section reads it. So the
    components are narrower than the Event as AOP-Wiki defines it. Read
    against the definition, the two nodes together are the Event, and
    neither asserts a change the Event does not cover, so they constitute it.
    Neither node alone is the Event: an assay of one arm measures part of it.
    The nodes are more specific than the Event, and that specificity is what
    the Event simplifies away. They split it into two parallel arms, each
    read by a different model. The inflammasome node names IL-1beta beside
    the IL-18 the Event names, and binds inflammasome assembly and signalling
    as processes, which the Event describes only in prose. The sensing node
    binds the chemical-stress response the Event's components leave out. The
    IL-1beta is counted inside the Event as one of the pro-inflammatory
    cytokines its definition covers, since the same caspase-1 step matures
    both, but the Event does not name it. It is recorded here so that it
    stays recoverable.
  notes: >-
    dismech's third keratinocyte node, Keratinocyte activation and
    proinflammatory mediator release, binds GO:0032980 too, at CELLULAR, but
    sits in the irritant arm downstream of Epidermal barrier disruption. It is
    not aggregated: it would assert a cause, barrier injury, that the Event
    does not have. The two aggregated nodes were added in
    monarch-initiative/dismech#16244, which resolved dismech's knowledge gap
    no_node_for_hapten_driven_keratinocyte_activation; before it, this record
    had no aggregation. dismech draws no edge between the two nodes, so there
    are no internal edges. Both take their inbound edge from the adduct node,
    which dismech's edge descriptions identify with AOP 40's KER 833. Both lead
    to Skin innate immune activation during sensitization, which is aggregated
    into KE 398, so those two edges correspond to KER 834. In the 2026-10-03
    snapshot KE 826 is in AOP 40 only. The aggregation is asserted for the
    Event, not for the pathway.
