notes: >-
  No aggregation. dismech's Contact_Dermatitis entry has one keratinocyte
  activation node, Keratinocyte activation and proinflammatory mediator
  release, at CELLULAR, binding GO:0032980 keratinocyte activation and
  GO:0006954 inflammatory response. Its level and process match the Event, but
  the node sits in the irritant arm, downstream of Epidermal barrier
  disruption, and its description is of barrier-injured keratinocytes. This
  Event is keratinocyte activation caused by hapten-protein complexes, with no
  barrier injury in the path. dismech records the missing step itself, as the
  knowledge gap no_node_for_hapten_driven_keratinocyte_activation. Aggregating
  the irritant node here would assert a cause the node does not carry, so
  nothing is aggregated until dismech has a sensitization-arm node.
