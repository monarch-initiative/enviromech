    notes: >-
      Three model links land on this node in dismech, all declaring model_scale
      TISSUE: mucociliary transport in hiPSC-derived airway epithelium (DECREASED),
      transport velocity across mixed wild-type and CCDC40-deficient cultures
      (DECREASED), and fluorescent-particle transport after CCDC40 mRNA delivery
      (INCREASED, a rescue). The node's description also cites whole-lung
      radioaerosol clearance, absent in most of 69 measured patients.
