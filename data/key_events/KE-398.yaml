  rationale: >-
    The Event is dendritic cell activation by the hapten-protein complex: the
    cell takes up the complex, matures, loads the antigen onto MHC and
    migrates to the lymph node to present it. Its two components are GO:0001775
    cell activation in a dendritic cell, and GO:0002396 MHC protein complex
    assembly. dismech splits that biology across two nodes and has no node for
    it alone. The innate activation node carries the first component: it binds
    Langerhans cells and dendritic cells and is the step that follows the
    adduct in skin. It is broader than the Event, since it is innate signalling
    in the whole allergen-exposed skin, of which dendritic cell activation is
    one part. The priming node carries the second component by reading, not by
    term: loading antigen onto MHC is part of the dendritic cell antigen
    processing and presentation it binds as GO:0002468, although GO does not
    relate GO:0002396 to GO:0002468. Its other process, T cell activation, lies
    outside this Event and belongs to KE 272. Each node asserts biology outside
    the Event, and neither is the Event, so the relation is overlaps. Neither
    node can stand in for the Event in a measurement.
  internal_edges:
  - upstream_node: Skin innate immune activation during sensitization
    downstream_node: Allergen-specific T-cell priming
    source_link_type: DIRECT
