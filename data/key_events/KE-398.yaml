  screened_on: "2026-10-31"
  note: >-
    No finding: the description carries words for the Cellular level. It
    describes dendritic cell maturation: uptake of the hapten-protein complex,
    up-regulation of surface markers, changes in cytokine and chemokine
    secretion, and migration to the lymph node. Migration crosses tissues, but
    the change described is in the cell.
term_findings:
- >-
  The biological process GO:0001775 cell activation names no cell type; the
  Event carries dendritic cell only in its cell term. GO's nearest narrower
  term is myeloid dendritic cell activation (GO:0001773), which is narrower
  than the Event's cell term as well, so it is not proposed as a replacement.
notes: >-
  No aggregation yet. The closest dismech node is Skin innate immune
  activation during sensitization, at TISSUE, with Langerhans cell and
  dendritic cell as its cell types and no process bound. It is broader than
  this Event: innate signalling in allergen-exposed skin, of which dendritic
  cell activation is one part. AggregationRelationEnum has constitutes, where
  the nodes are the Event, and narrower_than, where each node is a narrower
  case of it; neither fits a node that is wider than the Event, so no relation
  can be recorded. The Event's other component, MHC protein complex assembly,
  is nearer to dismech's Allergen-specific T-cell priming, which binds
  GO:0002468 dendritic cell antigen processing and presentation. So the Event
  spans parts of two dismech nodes and is the whole of neither.
