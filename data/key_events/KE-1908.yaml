    notes: >-
      Eight model readouts land on this node in dismech, including ciliary beat
      frequency (DECREASED after GSTA2 knockdown) and beat pattern (ALTERED in
      patient-derived nasal, organoid and hiPSC cultures). Its description records
      that frequency can be preserved: RSPH1-related disease keeps frequency with an
      abnormal circular waveform, and DNAH11-related disease is hyperkinetic.
