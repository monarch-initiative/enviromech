evidence:
- reference: PMID:41317111
  reference_title: "Effects of oral levodopa on motor symptoms and gait impairments in Parkinson's disease: a systematic review and meta-analysis."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: Oral levodopa induces substantial acute improvements in motor symptoms and key gait parameters but has limited effects on other gait characteristics, emphasizing the need for complementary and individualized interventions.
  explanation: >-
    A meta-analysis of 38 studies comparing patients on and off medication
    finds that levodopa improves motor scores.
- reference: PMID:25981231
  reference_title: "Levodopa alone compared with levodopa-sparing therapy as initial treatment for Parkinson's disease: a meta-analysis."
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: L-Dopa alone is the most effective medication available for treating the motor symptoms of PD patients, despite the greater incidence of involuntary movements.
  explanation: >-
    A meta-analysis of eleven randomised trials finds levodopa more effective
    on motor symptoms than levodopa-sparing therapy.
notes: >-
  The Causal Agent here is a treatment and the direction is a decrease: the
  observation bears on the Adverse Outcome by showing that restoring dopamine
  relieves the motor deficit.
