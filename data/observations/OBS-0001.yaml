- reference: PMID:37193692
  reference_title: A pesticide and iPSC dopaminergic neuron screen identifies and classifies Parkinson-relevant pesticides.
  supports: SUPPORT
  evidence_source: HUMAN_CLINICAL
  snippet: "Ten PWAS pesticides led to cell death >3 standard deviations above the DMSO control mean at a concentration of 30 µM: propargite, copper sulfate (basic and pentahydrate), dicofol, folpet, naled, endothall, trifluralin, endosulfan, and diquat dibromide"
  explanation: >-
    Names trifluralin as a PWAS pesticide, that is, one the paper's
    pesticide-wide association study implicated in Parkinson disease. The
    sentence reports the toxicity screen; it is quoted here for what it says
    about which pesticides the association study implicated.
notes: >-
  The association is with a diagnosis of Parkinson disease; the link to the
  Adverse Outcome, Parkinsonian motor deficits, rests on motor deficits being
  how the disease is diagnosed.
