notes: >-
  The paper's full text (PMC10188516, read through Europe PMC on 2026-10-03)
  names trifluralin among the pesticides its
  pesticide-wide association study implicated: "Ten PWAS pesticides led to cell
  death >3 standard deviations above the DMSO control mean at a concentration of
  30 µM: propargite, copper sulfate (basic and pentahydrate), dicofol, folpet,
  naled, endothall, trifluralin, endosulfan, and diquat dibromide". That quote
  is not checked by the reference validator: the cached text comes from the PDF,
  which breaks the sentence at a hyphenated line end and spells trifluralin with
  a ligature, so an exact match fails. The association is with a
  diagnosis of Parkinson disease; the link to the Adverse Outcome, Parkinsonian
  motor deficits, rests on motor deficits being how the disease is diagnosed.
