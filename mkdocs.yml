# Colors and light or dark mode: conf/site.yaml, which `just docs-build` and
# `just docs-serve` apply over the palette below.
#
# The documentation site, built with `just docs-build` and published by the
# docs workflow. The schema pages under docs/elements/ are generated by
# LinkML's gen-doc on every build; do not edit them. Edit the other pages in
# docs/ directly.
site_name: "EnviroMech"
site_description: "EnviroMech records how exposures to chemicals and other hazards relate to adverse effects, from associations with no known mechanism to mature Adverse Outcome Pathways."
site_url: https://monarch-initiative.github.io/enviromech/
repo_url: https://github.com/monarch-initiative/enviromech
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.magiclink
  # Material loads Mermaid itself for these blocks; no plugin is needed.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - The domain: DOMAIN.md
  - Curation: CURATION.md
  - Records: records/index.html
  - Corpus: corpus.md
  - Schema:
      - Classes, slots and enums: elements/index.md
      - Record structure: structure.md
  - Workflows: WORKFLOWS.md
  - Explanation:
      - Design Decisions: explanation/design-decisions.md
  - AOP-Wiki Data Errors: aop-wiki-data-errors.md
  - Working Notes & Reports:
      - Adopting mechmaker (2026-10): mechmaker.md
      - linkml-aop Schema Update (2026-09): linkml_aop_schema_update_plan.md
      - dismech AOP Handoff (2026-09-21): reports/dismech-aop-handoff-2026-09-21.md
  - To Do: TODO.md

watch:
  - src/enviromech/schema
